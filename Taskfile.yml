version: '3'

silent: true

vars:
  BIN_DIR: bin
  HELMDEX_BIN: '{{.BIN_DIR}}/helmdex'
  AGENT_TUI_SOCKET: '{{.AGENT_TUI_SOCKET | default "/tmp/agent-tui-test.sock"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task: help

  help:
    desc: List tasks
    cmds:
      - task --list

  # -----------------
  # JavaScript / TUI
  # -----------------
  deps:
    desc: Install JS dependencies (pnpm)
    cmds:
      - corepack pnpm install

  deps:ci:
    desc: Install JS dependencies for CI (frozen lockfile)
    cmds:
      - corepack pnpm install --frozen-lockfile

  test-tui:
    desc: Run TUI E2E tests (vitest)
    deps: [deps, build, test:fakehelm]
    vars:
      AGENT_TUI_NATIVE:
        sh: node -p "require('./node_modules/agent-tui/scripts/platform').resolveBinaryPath().binPath"
    env:
      AGENT_TUI_SOCKET: '{{.AGENT_TUI_SOCKET}}'
      AGENT_TUI_BIN: '{{.AGENT_TUI_NATIVE}}'
    cmds:
      - task: tui:daemon:native
        vars: { AGENT_TUI_NATIVE: '{{.AGENT_TUI_NATIVE}}' }
      - defer:
          task: tui:stop:native
          vars: { AGENT_TUI_NATIVE: '{{.AGENT_TUI_NATIVE}}' }
      - corepack pnpm exec vitest run --config tests/tui/vitest.config.ts

  test-tui:ci:
    desc: Run TUI E2E tests (vitest) in CI (frozen lockfile)
    deps: [deps:ci, build, test:fakehelm]
    vars:
      AGENT_TUI_NATIVE:
        sh: node -p "require('./node_modules/agent-tui/scripts/platform').resolveBinaryPath().binPath"
    env:
      AGENT_TUI_SOCKET: '{{.AGENT_TUI_SOCKET}}'
      AGENT_TUI_BIN: '{{.AGENT_TUI_NATIVE}}'
    cmds:
      - task: tui:daemon:native
        vars: { AGENT_TUI_NATIVE: '{{.AGENT_TUI_NATIVE}}' }
      - defer:
          task: tui:stop:native
          vars: { AGENT_TUI_NATIVE: '{{.AGENT_TUI_NATIVE}}' }
      - corepack pnpm exec vitest run --config tests/tui/vitest.config.ts

  tui:daemon:native:
    desc: Start agent-tui daemon using the native binary (avoids Node.js PTY sandbox)
    internal: true
    env:
      AGENT_TUI_SOCKET: '{{.AGENT_TUI_SOCKET}}'
    cmds:
      - '{{.AGENT_TUI_NATIVE}} daemon start --json'

  tui:stop:native:
    desc: Stop agent-tui daemon (native binary)
    internal: true
    env:
      AGENT_TUI_SOCKET: '{{.AGENT_TUI_SOCKET}}'
    cmds:
      - '{{.AGENT_TUI_NATIVE}} daemon stop --json || true'

  tui:daemon:
    desc: Start agent-tui daemon (idempotent)
    deps: [deps]
    cmds:
      - corepack pnpm exec tsx tests/tui/scripts/daemon-start.ts

  tui:stop:
    desc: Stop agent-tui daemon (idempotent)
    deps: [deps]
    cmds:
      - corepack pnpm exec tsx tests/tui/scripts/daemon-stop.ts

  tui:run:
    desc: Launch helmdex under test harness (internal)
    deps: [deps, build]
    cmds:
      - corepack pnpm exec tsx tests/tui/scripts/app-run.ts

  # -----
  # Go
  # -----
  build:
    desc: Build helmdex binary into ./bin
    sources:
      - ./go.mod
      - ./go.sum
      - ./cmd/**/*.go
      - ./internal/**/*.go
      - ./internal/server/static/**/*
      - ./package.json
    generates:
      - '{{.HELMDEX_BIN}}'
    vars:
      VERSION:
        sh: node -p "require('./package.json').version"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo ""
    cmds:
      - mkdir -p '{{.BIN_DIR}}'
      - >-
        go build -mod=vendor
        -ldflags "-X helmdex/internal/appinfo.Version=v{{.VERSION}} -X helmdex/internal/appinfo.Commit={{.COMMIT}}"
        -o '{{.HELMDEX_BIN}}' ./cmd/helmdex

  test:
    desc: Run Go unit tests
    cmds:
      - go test -mod=vendor ./...

  test:fakehelm:
    desc: Build the fake helm binary used by the hermetic E2E suites
    sources:
      - ./internal/testutil/fakehelm/**/*.go
    generates:
      - '{{.BIN_DIR}}/fakehelm/helm'
    cmds:
      - mkdir -p '{{.BIN_DIR}}/fakehelm'
      - go build -mod=vendor -o '{{.BIN_DIR}}/fakehelm/helm' ./internal/testutil/fakehelm

  test:server:
    desc: Run the HTTP API tests with the race detector
    cmds:
      - go test -mod=vendor -race ./internal/server/...

  fmt:
    desc: Format Go code (gofmt)
    cmds:
      - |
        bash -ceu '
          files=$(git ls-files "*.go" || true)
          if [ -z "${files}" ]; then
            echo "no go files found" >&2
            exit 0
          fi
          gofmt -w ${files}
        '

  vet:
    desc: Run go vet
    cmds:
      - go vet -mod=vendor ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint version
      - golangci-lint run

  # -----
  # Web UI
  # -----
  ui:dev:
    desc: Web UI dev loop (Go API + Vite dev server with /api proxy)
    deps: [deps, build]
    cmds:
      - |
        '{{.HELMDEX_BIN}}' ui --port 8117 &
        API_PID=$!
        trap "kill $API_PID" EXIT
        corepack pnpm --dir webui exec vite

  ui:serve:
    desc: Serve the embedded web UI from the built binary
    deps: [build]
    cmds:
      - "{{.HELMDEX_BIN}} ui --open"

  ui:build:
    desc: Build the web UI and embed it into internal/server/static
    deps: [deps]
    cmds:
      - corepack pnpm --dir webui exec tsc -b
      - corepack pnpm --dir webui exec vite build
      - rm -rf internal/server/static/assets
      - mkdir -p internal/server/static
      - cp -r webui/dist/* internal/server/static/

  ui:test:
    desc: Web UI typecheck + unit tests
    deps: [deps]
    cmds:
      - corepack pnpm --dir webui exec tsc -b
      - corepack pnpm --dir webui exec vitest run

  test-web:
    desc: Run web UI E2E tests (Playwright against the built binary)
    # ui:build must precede build: the binary embeds the SPA at compile time,
    # so building in the other order serves a stale bundle.
    deps: [deps, test:fakehelm]
    cmds:
      - task: ui:build
      - task: build
      - corepack pnpm exec playwright test --config tests/web/playwright.config.ts

  test-web:ci:
    desc: Run web UI E2E tests in CI (frozen lockfile)
    deps: [deps:ci, test:fakehelm]
    cmds:
      - task: ui:build
      - task: build
      - corepack pnpm exec playwright install --with-deps chromium
      - corepack pnpm exec playwright test --config tests/web/playwright.config.ts

  test:all:
    desc: Run every suite (Go, TUI E2E, web unit, web E2E)
    cmds:
      - task: test
      - task: test:server
      - task: ui:test
      - task: test-tui
      - task: test-web

  # -----
  # Desktop (Wails)
  # -----
  # The Go code under cmd/helmdex-desktop is gated by `//go:build desktop`
  # so plain `go build ./...` never needs the Wails/WebKit toolchain.

  desktop:install-tools:
    desc: Install the Wails CLI needed for desktop builds
    cmds:
      - go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

  desktop:build:
    desc: Build Helmdex Desktop for the current platform (unsigned)
    deps: [ui:build]
    dir: cmd/helmdex-desktop
    vars: &desktop-vars
      VERSION:
        sh: node -p "require('../../package.json').version"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo ""
      LDFLAGS: -X helmdex/internal/appinfo.Version=v{{.VERSION}} -X helmdex/internal/appinfo.Commit={{.COMMIT}}
    cmds:
      - wails build -tags desktop,webkit2_41 -trimpath -skipbindings -s -ldflags "{{.LDFLAGS}}"

  desktop:build:linux:amd64:
    desc: Build Helmdex Desktop for Linux amd64
    deps: [ui:build]
    dir: cmd/helmdex-desktop
    vars: *desktop-vars
    cmds:
      - |
        # Devbox puts a nix pkg-config first in PATH; the system one knows
        # about the distro's gtk/webkit dev packages.
        if [ -n "$DEVBOX_PROJECT_ROOT" ]; then
          export PATH="/usr/bin:$PATH"
        fi
        export PKG_CONFIG="${PKG_CONFIG:-/usr/bin/pkg-config}"
        export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        wails build -tags desktop,webkit2_41 -platform linux/amd64 -trimpath -skipbindings -s -devtools -ldflags "{{.LDFLAGS}}" -o helmdex-desktop-linux-amd64

  desktop:build:linux:arm64:
    desc: Build Helmdex Desktop for Linux arm64
    deps: [ui:build]
    dir: cmd/helmdex-desktop
    vars: *desktop-vars
    cmds:
      - |
        if [ -n "$DEVBOX_PROJECT_ROOT" ]; then
          export PATH="/usr/bin:$PATH"
        fi
        export PKG_CONFIG="${PKG_CONFIG:-/usr/bin/pkg-config}"
        export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        wails build -tags desktop,webkit2_41 -platform linux/arm64 -trimpath -skipbindings -s -devtools -ldflags "{{.LDFLAGS}}" -o helmdex-desktop-linux-arm64

  desktop:build:darwin:universal:
    desc: Build Helmdex Desktop for macOS (universal, must run on macOS)
    deps: [ui:build]
    dir: cmd/helmdex-desktop
    vars: *desktop-vars
    cmds:
      - wails build -tags desktop -platform darwin/universal -clean -trimpath -skipbindings -s -ldflags "{{.LDFLAGS}}" -o helmdex-desktop-darwin-universal

  desktop:build:windows:amd64:
    desc: Build Helmdex Desktop for Windows amd64 (must run on Windows)
    deps: [ui:build]
    dir: cmd/helmdex-desktop
    vars: *desktop-vars
    cmds:
      - wails build -tags desktop -platform windows/amd64 -trimpath -skipbindings -s -ldflags "{{.LDFLAGS}}" -nsis -o helmdex-desktop-windows-amd64.exe

  desktop:build:windows:arm64:
    desc: Build Helmdex Desktop for Windows arm64 (must run on Windows)
    deps: [ui:build]
    dir: cmd/helmdex-desktop
    vars: *desktop-vars
    cmds:
      - wails build -tags desktop -platform windows/arm64 -trimpath -skipbindings -s -ldflags "{{.LDFLAGS}}" -nsis -o helmdex-desktop-windows-arm64.exe

  hooks:
    desc: Install git hooks (using .githooks/)
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed (using .githooks/)"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf '{{.BIN_DIR}}'

  ci:
    desc: CI pipeline (matches GitHub Actions)
    cmds:
      - task: test
      - task: test:server
      - task: ui:test
      - task: test-tui:ci
      - task: test-web:ci
